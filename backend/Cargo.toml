[package]
name = "artha-server"
version = "0.0.1"
edition = "2021"
description = "ARTHA local-first billing & inventory server"

[lib]
name = "artha_server"
path = "src/lib.rs"

[[bin]]
name = "artha-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Argon2 is unusably slow at opt-level 0; optimise dependencies in dev/test builds.
[profile.dev.package."*"]
opt-level = 2
